<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Pesquisa - Desenvolvimento de Sistemas</title> <link rel="stylesheet" href="style.css"> </head> <body>
<main class="container">

    <header>
        <h1>🚀 Formulario coneção ceep </h1>
        <p>Queremos saber sua opinião sobre os projetos apresentados.</p>
    </header>

    <form>

        <!-- DADOS -->
        <section>
            <h2>👨‍🚀 Sobre você</h2>

            <label>Nome:</label>
            <input type="text" placeholder="Digite seu nome">

            <label>Turma:</label>
            <input type="text" placeholder="Digite sua turma">
        </section>

        <!-- SITE -->
        <section>
            <h2>🚀 Grupo 1 - Site</h2>

            <label>O que você achou do site?</label>
            <div class="opcoes">
                <label><input type="radio" name="site_opiniao"> Excelente</label>
                <label><input type="radio" name="site_opiniao"> Muito bom</label>
                <label><input type="radio" name="site_opiniao"> Bom</label>
                <label><input type="radio" name="site_opiniao"> Regular</label>
                <label><input type="radio" name="site_opiniao"> Ruim</label>
            </div>

            <label>Qual nota você daria ao site?</label>
            <select>
                <option>Selecione</option>
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Bom</option>
                <option>5 - Excelente</option>
            </select>

            <label>O que você mais gostou no site?</label>
            <div class="opcoes">
                <label><input type="radio" name="site_gostou"> Design</label>
                <label><input type="radio" name="site_gostou"> Organização</label>
                <label><input type="radio" name="site_gostou"> Cores</label>
                <label><input type="radio" name="site_gostou"> Facilidade de usar</label>
                <label><input type="radio" name="site_gostou"> Conteúdo</label>
            </div>
        </section>

        <!-- PROJETO -->
        <section>
            <h2>🛠️ Grupo 2 - Projeto</h2>

            <label>O que você achou do projeto?</label>
            <div class="opcoes">
                <label><input type="radio" name="projeto_opiniao"> Excelente</label>
                <label><input type="radio" name="projeto_opiniao"> Muito bom</label>
                <label><input type="radio" name="projeto_opiniao"> Bom</label>
                <label><input type="radio" name="projeto_opiniao"> Regular</label>
                <label><input type="radio" name="projeto_opiniao"> Ruim</label>
            </div>

            <label>Qual nota você daria ao projeto?</label>
            <select>
                <option>Selecione</option>
                <option>1 - Muito ruim</option>
                <option>2 - Ruim</option>
                <option>3 - Regular</option>
                <option>4 - Bom</option>
                <option>5 - Excelente</option>
            </select>

            <label>O que você mais gostou no projeto?</label>
            <div class="opcoes">
                <label><input type="radio" name="projeto_gostou"> Ideia</label>
                <label><input type="radio" name="projeto_gostou"> Criatividade</label>
                <label><input type="radio" name="projeto_gostou"> Funcionamento</label>
                <label><input type="radio" name="projeto_gostou"> Organização</label>
                <label><input type="radio" name="projeto_gostou"> Apresentação</label>
            </div>
        </section>

        <!-- IA -->
        <section>
            <h2>🤖 Grupo 3 - Aplicativo com IA</h2>

            <label>O que você achou do aplicativo?</label>
            <div class="opcoes">
                <label><input type="radio" name="ia_opiniao"> Excelente</label>
                <label><input type="radio" name="ia_opiniao"> Muito bom</label>
                <label><input type="radio" name="ia_opiniao"> Bom</label>
                <label><input type="radio" name="ia_opiniao"> Regular</label>
                <label><input type="radio" name="ia_opiniao"> Ruim</label>
            </div>

            <label>O que você mais gostou?</label>
            <div class="opcoes">
                <label><input type="radio" name="ia_gostou"> Inteligência Artificial</label>
                <label><input type="radio" name="ia_gostou"> Design</label>
                <label><input type="radio" name="ia_gostou"> Facilidade de uso</label>
                <label><input type="radio" name="ia_gostou"> Funcionalidades</label>
                <label><input type="radio" name="ia_gostou"> Ideia do aplicativo</label>
            </div>

            <label>Você usaria esse aplicativo para estudar?</label>
            <div class="opcoes">
                <label><input type="radio" name="ia_usaria"> Sim</label>
                <label><input type="radio" name="ia_usaria"> Talvez</label>
                <label><input type="radio" name="ia_usaria"> Não</label>
            </div>
        </section>

        <!-- JOGOS -->
        <section>
            <h2>🎮 Grupo 4 - Jogos</h2>

            <label>O que você achou dos jogos?</label>
            <div class="opcoes">
                <label><input type="radio" name="jogos_opiniao"> Excelente</label>
                <label><input type="radio" name="jogos_opiniao"> Muito bom</label>
                <label><input type="radio" name="jogos_opiniao"> Bom</label>
                <label><input type="radio" name="jogos_opiniao"> Regular</label>
                <label><input type="radio" name="jogos_opiniao"> Ruim</label>
            </div>

            <label>O que você mais gostou?</label>
            <div class="opcoes">
                <label><input type="radio" name="jogos_gostou"> Gráficos</label>
                <label><input type="radio" name="jogos_gostou"> Jogabilidade</label>
                <label><input type="radio" name="jogos_gostou"> Criatividade</label>
                <label><input type="radio" name="jogos_gostou"> Desafio</label>
                <label><input type="radio" name="jogos_gostou"> Diversão</label>
            </div>

            <label>Você jogaria algum dos jogos?</label>
            <div class="opcoes">
                <label><input type="radio" name="jogos_usaria"> Sim</label>
                <label><input type="radio" name="jogos_usaria"> Talvez</label>
                <label><input type="radio" name="jogos_usaria"> Não</label>
            </div>
        </section>

        <!-- OPINIÃO FINAL -->
        <section>
            <h2>⭐ Opinião Final</h2>

            <label>Qual trabalho chamou mais sua atenção?</label>
            <select>
                <option>Selecione</option>
                <option>Site</option>
                <option>Projeto</option>
                <option>Aplicativo com IA</option>
                <option>Jogos</option>
            </select>

            <label>Como você avalia a apresentação dos grupos?</label>
            <div class="opcoes">
                <label><input type="radio" name="apresentacao"> Excelente</label>
                <label><input type="radio" name="apresentacao"> Muito boa</label>
                <label><input type="radio" name="apresentacao"> Boa</label>
                <label><input type="radio" name="apresentacao"> Regular</label>
                <label><input type="radio" name="apresentacao"> Ruim</label>
            </div>

            <label>O que poderia melhorar?</label>
            <div class="opcoes">
                <label><input type="radio" name="melhoria"> Design</label>
                <label><input type="radio" name="melhoria"> Organização</label>
                <label><input type="radio" name="melhoria"> Funcionalidades</label>
                <label><input type="radio" name="melhoria"> Apresentação</label>
                <label><input type="radio" name="melhoria"> Nada, está ótimo</label>
            </div>
        </section>

        <button type="submit">ENVIAR PESQUISA 🚀</button>

    </form>

    <footer>
        <p>Que a Força esteja com você! ✨</p>
    </footer>

</main>

</body> </html>
